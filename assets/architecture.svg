<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <style>
      .layer-title { font-size: 14px; font-weight: 600; fill: #171717; }
      .layer-sub { font-size: 11px; fill: #6B7280; }
      .module-name { font-size: 12px; font-weight: 600; fill: #1F2937; }
      .module-sub { font-size: 10px; fill: #6B7280; }
      .flow-label { font-size: 10px; fill: #6B7280; font-style: italic; }
      .principle { font-size: 11px; fill: #2563EB; font-weight: 500; }
    </style>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#171717">JSON Studio — Architecture</text>
  <text x="440" y="54" text-anchor="middle" font-size="11" fill="#6B7280">Client-side only · No backend · No external API</text>

  <g>
    <rect x="60" y="90" width="760" height="100" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <text x="76" y="110" class="layer-title">UI Layer</text>
    <text x="76" y="126" class="layer-sub">renders state · captures input · no business logic</text>
    <rect x="100" y="138" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="160" y="156" text-anchor="middle" class="module-name">App</text>
    <text x="160" y="170" text-anchor="middle" class="module-sub">root</text>
    <rect x="240" y="138" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="300" y="156" text-anchor="middle" class="module-name">Editor</text>
    <text x="300" y="170" text-anchor="middle" class="module-sub">input + output</text>
    <rect x="380" y="138" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="440" y="156" text-anchor="middle" class="module-name">Toolbar</text>
    <text x="440" y="170" text-anchor="middle" class="module-sub">actions</text>
    <rect x="520" y="138" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="580" y="156" text-anchor="middle" class="module-name">Settings</text>
    <text x="580" y="170" text-anchor="middle" class="module-sub">indentation</text>
    <rect x="660" y="138" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="720" y="156" text-anchor="middle" class="module-name">StatusBar</text>
    <text x="720" y="170" text-anchor="middle" class="module-sub">feedback</text>
  </g>

  <line x1="440" y1="195" x2="440" y2="225" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="214" class="flow-label">user events</text>

  <g>
    <rect x="60" y="230" width="760" height="80" rx="10" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1"/>
    <text x="76" y="250" class="layer-title">State Layer</text>
    <text x="76" y="266" class="layer-sub">single source of truth · orchestrates processing</text>
    <rect x="320" y="278" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="440" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB" font-family="ui-monospace, Menlo, monospace">useJsonEditor</text>
  </g>

  <line x1="440" y1="315" x2="440" y2="345" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="334" class="flow-label">calls</text>

  <g>
    <rect x="60" y="350" width="760" height="110" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <text x="76" y="370" class="layer-title">Processing Layer</text>
    <text x="76" y="386" class="layer-sub">pure functions · string in, structured result out</text>
    <rect x="120" y="402" width="200" height="48" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="220" y="422" text-anchor="middle" class="module-name">parser.ts</text>
    <text x="220" y="438" text-anchor="middle" class="module-sub">validate + locate errors</text>
    <rect x="340" y="402" width="200" height="48" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="440" y="422" text-anchor="middle" class="module-name">formatter.ts</text>
    <text x="440" y="438" text-anchor="middle" class="module-sub">pretty-print</text>
    <rect x="560" y="402" width="200" height="48" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="660" y="422" text-anchor="middle" class="module-name">minifier.ts</text>
    <text x="660" y="438" text-anchor="middle" class="module-sub">collapse whitespace</text>
  </g>

  <line x1="440" y1="465" x2="440" y2="495" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="484" class="flow-label">uses</text>

  <g>
    <rect x="60" y="500" width="760" height="60" rx="10" fill="#171717"/>
    <text x="76" y="520" font-size="14" font-weight="600" fill="#FFFFFF">Native Engine</text>
    <text x="76" y="536" font-size="11" fill="#9CA3AF">the browser's built-in JSON object — no libraries</text>
    <rect x="280" y="514" width="160" height="32" rx="6" fill="#0F172A" stroke="#1F2937"/>
    <text x="360" y="534" text-anchor="middle" font-size="12" font-weight="600" fill="#60A5FA" font-family="ui-monospace, Menlo, monospace">JSON.parse</text>
    <rect x="460" y="514" width="180" height="32" rx="6" fill="#0F172A" stroke="#1F2937"/>
    <text x="550" y="534" text-anchor="middle" font-size="12" font-weight="600" fill="#60A5FA" font-family="ui-monospace, Menlo, monospace">JSON.stringify</text>
  </g>

  <g>
    <text x="840" y="120" text-anchor="end" class="principle">↓ dependencies flow downward only</text>
    <text x="840" y="580" text-anchor="end" class="principle">each layer is unit-testable in isolation</text>
  </g>
</svg>
